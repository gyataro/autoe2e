[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoe2e"
version = "0.1.0"
description = "Feature-driven end-to-end test generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.12.2",
    "jinja2",
    "langchain>=0.3.30",
    "langchain-core",
    "langchain-openai",
    "numpy",
    "pillow",
    "playwright",
    "python-dotenv==1.0.0",
    "sqlite-vec>=0.1.9",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"autoe2e/utils/__init__.py" = ["E402"]

[tool.hatch.build.targets.wheel]
packages = ["autoe2e"]
